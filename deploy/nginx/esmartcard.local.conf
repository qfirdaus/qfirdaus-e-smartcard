server {
    listen 80;
    server_name esmartcard.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name esmartcard.local;

    root /var/www/app/e-smartcard-uat/public;
    index index.php;

    ssl_certificate     /home/iqs/ssl/local-dev.pem;
    ssl_certificate_key /home/iqs/ssl/local-dev-key.pem;

    client_max_body_size 10M;

    access_log /var/log/nginx/esmartcard.local.access.log;
    error_log  /var/log/nginx/esmartcard.local.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /uploads/ {
        location ~ \.php$ {
            deny all;
        }
        autoindex off;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
